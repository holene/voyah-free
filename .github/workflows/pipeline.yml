name: Docs pipeline

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "tools/pipeline/**"
      - "src/raw/pdfs/**"
  pull_request:
    branches: [main, master]
    paths:
      - "tools/pipeline/**"
      - "src/raw/pdfs/**"

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r tools/pipeline/requirements.txt

      - name: Run PDF pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: PYTHONPATH=tools/pipeline python -m voyah_pipeline.cli all
